[package]
name = "switch_windows"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pane's Rust SDK, from crates.io.
pane-extension = "0.2"
# As Pane's own guests workspace builds its components: a small component,
# with no unwinding to carry into the WebAssembly component.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
